kafka:
  brokers:
    - "localhost:9092"
  topic: "usage-events"
  acks: 1
  batchSize: 65536
  lingerMs: 5
  bufferMemory: 67108864
  compressionType: "lz4"
  maxBlockMs: 60000

simulation:
  mode: "constant"
  tps: 100
  workerCount: 4

  families:
    count: 1000
    maxMembers: 6

  rampUp:
    startTps: 10
    targetTps: 100
    durationSeconds: 30

  burst:
    baseTps: 100
    burstTps: 500
    burstDurationSeconds: 5
    intervalSeconds: 30

  # fixedTargets:              # 설정 시 해당 ID들로만 이벤트 생성 (랜덤 대체)
  #   - familyId: 12345
  #     customerIds: [100001, 100002, 100003]
  #   - familyId: 67890
  #     customerIds: [200001, 200002]

server:
  controlPort: 8080
  metricsPort: 9090

logging:
  level: "debug"
  format: "text"
